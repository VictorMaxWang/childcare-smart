name: smartchildcare-production
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: childcare
      MYSQL_USER: childcare
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=128M", "--max-connections=30", "--performance-schema=OFF"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
  backend:
    image: ${BACKEND_IMAGE:?required}
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - path: .env.backend
        format: raw
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
  web:
    image: ${WEB_IMAGE:?required}
    restart: unless-stopped
    mem_limit: 640m
    env_file:
      - path: .env.web
        format: raw
    environment:
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=384
      BRAIN_API_BASE_URL: http://backend:8000
      BACKEND_BASE_URL: http://backend:8000
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      web:
        condition: service_healthy
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  mysql_data:
  backend_data:
  caddy_data:
  caddy_config:
